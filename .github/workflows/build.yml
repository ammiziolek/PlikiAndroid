name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Budowanie APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Nazwa pliku
        run: cp app/build/outputs/apk/release/app-release.apk Pliki-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pliki-APK
          path: Pliki-1.0.${{ github.run_number }}.apk

      - name: Wydanie (do pobrania na telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pliki 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          body: |
            Pobierz plik **Pliki-1.0.${{ github.run_number }}.apk** poniżej i otwórz go na telefonie, żeby zainstalować.
            Zbudowano z gałęzi `${{ github.ref_name }}`.
          files: Pliki-1.0.${{ github.run_number }}.apk
